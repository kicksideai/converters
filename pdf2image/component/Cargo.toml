[package]
name = "pdf2image"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "WebAssembly component that renders PDF pages to PNG, JPEG, or WEBP images"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
hayro = "0.7"
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }

[profile.release]
opt-level = "s"
strip = true
lto = true
