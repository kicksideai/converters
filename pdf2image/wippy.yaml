organization: kickside
module: pdf2image
description: Renders a PDF from a URL or a binary blob into per-page PNG, JPEG, or WEBP images
license: MIT
repository: https://github.com/kicksideai/converters
keywords:
  - pdf
  - image
  - png
  - jpeg
  - webp
  - render
  - wasm
embed:
  - kickside.convert.pdf2image:assets
exclude:
  - "app:**"
  - "app.env:**"
  - "app.deps:**"
  - "test/**"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
